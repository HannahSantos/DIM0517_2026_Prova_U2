name: Go

on:
    pull-request:
      types:
        - closed
      branch: [dev]

jobs:
  if_merged_build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build -o app ./src

      - name: Tagging if successful
        if: success()
        run: git tag -d $TAG
        env: TAG="build-${{ github.run_id }}"
