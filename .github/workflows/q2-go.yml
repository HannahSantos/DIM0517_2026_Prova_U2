name: Go

on:
  pull-request:
    branches: [dev]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        run: go build -o app ./src

      - name: Test
        run: go run .src/main_test.go
